apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: darren-marie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image:  europe-west1-docker.pkg.dev/polytech-dijon/polytech-dijon/calculatrice-frontend-darren-marie:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu : "4m"
              memory: "32Mi"   


---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: darren-marie
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
  type: NodePort
