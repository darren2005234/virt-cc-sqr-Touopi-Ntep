apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: darren-marie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres  # Nettoyé : seulement l'app
  template:
    metadata:
      labels:
        app: postgres  # Doit être identique au selector ci-dessus
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: calculdb
        - name: POSTGRES_USER
          value: calculuser
        - name: POSTGRES_PASSWORD
          value: calculpass
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: darren-marie
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432